<svg xmlns="http://www.w3.org/2000/svg" width="{{size}}" height="{{size}}" viewBox="0 0 160 160" role="img" aria-label="{{name}}：{{stateLabel}}" data-skin="premium-aurora" data-state="{{state}}">
  <title>{{name}} · {{stateLabel}}</title>
  <desc>AgentDeck 付费皮肤「极光」：会呼吸的极光渐层与星屑尾迹，当前状态 {{stateLabel}}</desc>
  <defs>
    <linearGradient id="aur-bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#061225"/>
      <stop offset="0.45" stop-color="#0d1f3d"/>
      <stop offset="1" stop-color="#1b1030"/>
    </linearGradient>
    <linearGradient id="aur-veil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4be0c8" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#7ef3ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c98bff" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="aur-body" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f4feff"/>
      <stop offset="0.55" stop-color="#cdf1ff"/>
      <stop offset="1" stop-color="#b8c7ff"/>
    </linearGradient>
    <radialGradient id="aur-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ef3ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7ef3ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="aur-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="aur-frame">
      <rect x="3" y="3" width="154" height="154" rx="34"/>
    </clipPath>
  </defs>
  <style>
    .state { display: none; }
    [data-state="idle"] .s-idle,
    [data-state="working"] .s-working,
    [data-state="meeting"] .s-meeting,
    [data-state="visiting"] .s-visiting,
    [data-state="sleeping"] .s-sleeping { display: inline; }
    .eye-open { display: inline; }
    .eye-closed { display: none; }
    [data-state="sleeping"] .eye-open { display: none; }
    [data-state="sleeping"] .eye-closed { display: inline; }
    [data-state="sleeping"] .veil { opacity: 0.4; }
    .label { font: 600 12px/1 "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; fill: {{accent}}; letter-spacing: 0.14em; }
  </style>
  <g clip-path="url(#aur-frame)">
    <rect x="0" y="0" width="160" height="160" fill="url(#aur-bg)"/>
    <g class="veil" opacity="0.9">
      <path d="M-10 62 q44 -34 92 -12 q40 18 84 -6 v34 q-44 22 -86 4 q-46 -20 -90 8 z" fill="url(#aur-veil)"/>
      <path d="M-8 24 q40 20 86 8 q44 -12 80 10 v16 q-40 -20 -82 -8 q-46 12 -84 -8 z" fill="url(#aur-veil)" opacity="0.55"/>
    </g>
    <circle cx="80" cy="94" r="58" fill="url(#aur-aura)"/>
    <g fill="#ffffff">
      <circle cx="30" cy="36" r="1.6" opacity="0.9"/>
      <circle cx="52" cy="22" r="1.1" opacity="0.65"/>
      <circle cx="132" cy="30" r="1.8" opacity="0.85"/>
      <circle cx="118" cy="16" r="1" opacity="0.5"/>
      <circle cx="146" cy="58" r="1.2" opacity="0.6"/>
      <circle cx="18" cy="86" r="1" opacity="0.45"/>
      <circle cx="140" cy="104" r="1.4" opacity="0.5"/>
    </g>
    <ellipse cx="80" cy="140" rx="42" ry="8" fill="{{accent}}" opacity="0.2"/>
    <path d="M54 48 q-10 -15 3 -21 q10 -4 13 11 z" fill="url(#aur-body)" stroke="#8fb6ff" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M106 48 q10 -15 -3 -21 q-10 -4 -13 11 z" fill="url(#aur-body)" stroke="#8fb6ff" stroke-width="2.2" stroke-linejoin="round"/>
    <ellipse cx="80" cy="108" rx="42" ry="33" fill="url(#aur-body)" stroke="#8fb6ff" stroke-width="2.2"/>
    <circle cx="80" cy="71" r="33" fill="url(#aur-body)" stroke="#8fb6ff" stroke-width="2.2"/>
    <g class="eye-open" filter="url(#aur-glow)">
      <circle cx="69" cy="69" r="4.4" fill="#17335c"/>
      <circle cx="91" cy="69" r="4.4" fill="#17335c"/>
      <circle cx="70.6" cy="67.2" r="1.6" fill="{{accent}}"/>
      <circle cx="92.6" cy="67.2" r="1.6" fill="{{accent}}"/>
    </g>
    <g class="eye-closed">
      <path d="M64 69 q5 5 10 0" fill="none" stroke="#17335c" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M86 69 q5 5 10 0" fill="none" stroke="#17335c" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <circle cx="57" cy="80" r="7" fill="#c98bff" opacity="0.35"/>
    <circle cx="103" cy="80" r="7" fill="#c98bff" opacity="0.35"/>
    <path d="M76 82 q4 4 8 0" fill="none" stroke="#4f6f9c" stroke-width="2" stroke-linecap="round"/>
    <path d="M58 112 q22 -12 44 0" fill="none" stroke="{{accent}}" stroke-width="2" opacity="0.55"/>
    <path d="M112 116 q22 -4 26 -24 q3 -16 -10 -20" fill="none" stroke="url(#aur-veil)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <g class="state s-idle">
      <circle cx="125" cy="42" r="2.8" fill="{{accent}}" opacity="0.9"/>
      <circle cx="133" cy="56" r="1.8" fill="#c98bff" opacity="0.7"/>
      <circle cx="117" cy="30" r="1.4" fill="#ffffff" opacity="0.6"/>
      <path d="M26 58 q8 -10 16 0" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
    </g>
    <g class="state s-working">
      <rect x="98" y="24" width="44" height="32" rx="7" fill="#08182e" stroke="{{accent}}" stroke-width="1.6" opacity="0.95"/>
      <rect x="103" y="30" width="26" height="2.6" rx="1.3" fill="{{accent}}"/>
      <rect x="103" y="36" width="34" height="2.6" rx="1.3" fill="#c98bff"/>
      <rect x="103" y="42" width="18" height="2.6" rx="1.3" fill="{{accent}}" opacity="0.6"/>
      <rect x="103" y="48" width="28" height="2.6" rx="1.3" fill="#ffffff" opacity="0.45"/>
      <circle cx="34" cy="102" r="13" fill="none" stroke="#26405f" stroke-width="3.6"/>
      <path d="M34 89 a13 13 0 0 1 13 13" fill="none" stroke="{{accent}}" stroke-width="3.6" stroke-linecap="round"/>
    </g>
    <g class="state s-meeting">
      <rect x="18" y="26" width="44" height="24" rx="9" fill="#0a1c33" stroke="{{accent}}" stroke-width="1.8" opacity="0.95"/>
      <path d="M32 50 l0 8 l9 -8 z" fill="#0a1c33" stroke="{{accent}}" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="31" cy="38" r="2.2" fill="{{accent}}"/>
      <circle cx="40" cy="38" r="2.2" fill="{{accent}}"/>
      <circle cx="49" cy="38" r="2.2" fill="{{accent}}" opacity="0.6"/>
      <rect x="100" y="30" width="42" height="22" rx="9" fill="#0a1c33" stroke="#c98bff" stroke-width="1.8" opacity="0.95"/>
      <path d="M124 52 l0 8 l-8 -8 z" fill="#0a1c33" stroke="#c98bff" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M108 38 h26 M108 44 h14" stroke="#c98bff" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
    </g>
    <g class="state s-visiting">
      <ellipse cx="126" cy="88" rx="11" ry="23" fill="none" stroke="{{accent}}" stroke-width="2" opacity="0.85"/>
      <ellipse cx="126" cy="88" rx="4" ry="14" fill="{{accent}}" opacity="0.3"/>
      <path d="M30 74 h26 v18 h-26 z" fill="none" stroke="{{accent}}" stroke-width="1.8" opacity="0.8"/>
      <path d="M30 75 l13 11 l13 -11" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linejoin="round" opacity="0.8"/>
      <circle cx="46" cy="122" r="2.2" fill="#c98bff" opacity="0.8"/>
    </g>
    <g class="state s-sleeping">
      <path d="M110 26 a15 15 0 1 0 0 22 a12 12 0 0 1 0 -22 z" fill="{{accent}}" opacity="0.35"/>
      <text x="118" y="62" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="{{accent}}" opacity="0.8">z</text>
      <text x="130" y="52" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="{{accent}}" opacity="0.5">z</text>
    </g>
    <text class="label" x="80" y="152" text-anchor="middle">{{stateLabel}}</text>
  </g>
</svg>
