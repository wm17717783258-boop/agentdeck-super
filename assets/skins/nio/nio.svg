<svg xmlns="http://www.w3.org/2000/svg" width="{{size}}" height="{{size}}" viewBox="0 0 160 160" role="img" aria-label="{{name}}：{{stateLabel}}" data-skin="nio" data-state="{{state}}">
  <title>{{name}} · {{stateLabel}}</title>
  <desc>AgentDeck 内置免费皮肤「霓虹」：赛博小机甲，当前状态 {{stateLabel}}</desc>
  <defs>
    <linearGradient id="nio-bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="0.55" stop-color="#152238"/>
      <stop offset="1" stop-color="#241335"/>
    </linearGradient>
    <linearGradient id="nio-body" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#eafcff"/>
      <stop offset="1" stop-color="#9fd6ea"/>
    </linearGradient>
    <linearGradient id="nio-visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101c2e"/>
      <stop offset="1" stop-color="#1d3350"/>
    </linearGradient>
    <filter id="nio-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="nio-frame">
      <rect x="3" y="3" width="154" height="154" rx="34"/>
    </clipPath>
  </defs>
  <style>
    .state { display: none; }
    [data-state="idle"] .s-idle,
    [data-state="working"] .s-working,
    [data-state="meeting"] .s-meeting,
    [data-state="visiting"] .s-visiting,
    [data-state="sleeping"] .s-sleeping { display: inline; }
    .eye-open { display: inline; }
    .eye-closed { display: none; }
    [data-state="sleeping"] .eye-open { display: none; }
    [data-state="sleeping"] .eye-closed { display: inline; }
    [data-state="sleeping"] .glow { opacity: 0.35; }
    .label { font: 600 12px/1 "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; fill: {{accent}}; letter-spacing: 0.12em; }
  </style>
  <g clip-path="url(#nio-frame)">
    <rect x="0" y="0" width="160" height="160" fill="url(#nio-bg)"/>
    <circle cx="80" cy="80" r="62" fill="none" stroke="{{accent}}" stroke-width="1" opacity="0.18"/>
    <circle cx="80" cy="80" r="48" fill="none" stroke="#ff5fd2" stroke-width="1" opacity="0.14"/>
    <path d="M18 128 h124" stroke="{{accent}}" stroke-width="1" opacity="0.2"/>
    <ellipse cx="80" cy="141" rx="40" ry="7" fill="{{accent}}" opacity="0.16"/>
    <g class="glow" filter="url(#nio-glow)">
      <path d="M80 20 v12" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="80" cy="18" r="3.4" fill="{{accent}}"/>
    </g>
    <rect x="46" y="86" width="68" height="46" rx="14" fill="url(#nio-body)" stroke="#3d6f8c" stroke-width="2.4"/>
    <rect x="44" y="44" width="72" height="46" rx="16" fill="url(#nio-body)" stroke="#3d6f8c" stroke-width="2.4"/>
    <rect x="52" y="55" width="56" height="25" rx="11" fill="url(#nio-visor)"/>
    <g class="eye-open glow" filter="url(#nio-glow)">
      <rect x="60" y="63" width="12" height="9" rx="4.5" fill="{{accent}}"/>
      <rect x="88" y="63" width="12" height="9" rx="4.5" fill="{{accent}}"/>
    </g>
    <g class="eye-closed">
      <rect x="60" y="67" width="12" height="3" rx="1.5" fill="{{accent}}"/>
      <rect x="88" y="67" width="12" height="3" rx="1.5" fill="{{accent}}"/>
    </g>
    <path d="M76 78 h8" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
    <rect x="58" y="96" width="44" height="8" rx="4" fill="#2b4a63" opacity="0.55"/>
    <rect x="58" y="96" width="26" height="8" rx="4" fill="{{accent}}"/>
    <rect x="58" y="110" width="18" height="4" rx="2" fill="#2b4a63" opacity="0.5"/>
    <rect x="80" y="110" width="12" height="4" rx="2" fill="#ff5fd2" opacity="0.65"/>
    <g class="state s-idle">
      <circle cx="124" cy="42" r="3" fill="{{accent}}" opacity="0.9"/>
      <circle cx="132" cy="56" r="2" fill="#ff5fd2" opacity="0.7"/>
      <circle cx="118" cy="32" r="1.6" fill="{{accent}}" opacity="0.55"/>
      <circle cx="34" cy="60" r="1.8" fill="{{accent}}" opacity="0.45"/>
    </g>
    <g class="state s-working">
      <rect x="96" y="26" width="46" height="34" rx="6" fill="#0d1a2c" stroke="{{accent}}" stroke-width="1.6" opacity="0.95"/>
      <rect x="101" y="32" width="28" height="2.6" rx="1.3" fill="{{accent}}"/>
      <rect x="101" y="38" width="20" height="2.6" rx="1.3" fill="#ff5fd2"/>
      <rect x="101" y="44" width="34" height="2.6" rx="1.3" fill="{{accent}}" opacity="0.6"/>
      <rect x="101" y="50" width="14" height="2.6" rx="1.3" fill="{{accent}}" opacity="0.4"/>
      <circle cx="34" cy="104" r="12" fill="none" stroke="#2b4a63" stroke-width="3.4"/>
      <path d="M34 92 a12 12 0 0 1 12 12" fill="none" stroke="{{accent}}" stroke-width="3.4" stroke-linecap="round"/>
    </g>
    <g class="state s-meeting">
      <circle cx="34" cy="40" r="7" fill="#0d1a2c" stroke="{{accent}}" stroke-width="1.8"/>
      <circle cx="126" cy="40" r="7" fill="#0d1a2c" stroke="#ff5fd2" stroke-width="1.8"/>
      <circle cx="80" cy="26" r="7" fill="#0d1a2c" stroke="{{accent}}" stroke-width="1.8"/>
      <path d="M41 40 h10 M109 40 h-10 M80 33 v-0.2 M52 30 l20 -2 M108 30 l-20 -2" stroke="{{accent}}" stroke-width="1.6" opacity="0.6"/>
      <rect x="108" y="28" width="1" height="1" fill="{{accent}}" opacity="0"/>
      <path d="M30 116 q10 -8 20 0" fill="none" stroke="{{accent}}" stroke-width="1.6" opacity="0.5"/>
    </g>
    <g class="state s-visiting">
      <ellipse cx="126" cy="86" rx="10" ry="22" fill="none" stroke="{{accent}}" stroke-width="2" opacity="0.8"/>
      <ellipse cx="126" cy="86" rx="4" ry="13" fill="{{accent}}" opacity="0.35"/>
      <path d="M28 62 l14 8 l-14 8 z" fill="{{accent}}" opacity="0.8"/>
      <path d="M24 70 h12" stroke="{{accent}}" stroke-width="1.6" opacity="0.5"/>
      <circle cx="44" cy="120" r="2.4" fill="#ff5fd2" opacity="0.8"/>
    </g>
    <g class="state s-sleeping">
      <path d="M112 26 a14 14 0 1 0 0 21 a11 11 0 0 1 0 -21 z" fill="{{accent}}" opacity="0.35"/>
      <text x="118" y="60" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="{{accent}}" opacity="0.8">z</text>
      <text x="130" y="50" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="{{accent}}" opacity="0.55">z</text>
    </g>
    <text class="label" x="80" y="152" text-anchor="middle">{{stateLabel}}</text>
  </g>
</svg>
