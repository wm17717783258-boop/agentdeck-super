<svg xmlns="http://www.w3.org/2000/svg" width="{{size}}" height="{{size}}" viewBox="0 0 160 160" role="img" aria-label="{{name}}：{{stateLabel}}" data-skin="basic" data-state="{{state}}">
  <title>{{name}} · {{stateLabel}}</title>
  <desc>AgentDeck 内置免费皮肤「原味」：一只安静的奶油色小兽，当前状态 {{stateLabel}}</desc>
  <defs>
    <linearGradient id="basic-bg" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#fdf8ef"/>
      <stop offset="1" stop-color="#eeddc4"/>
    </linearGradient>
    <linearGradient id="basic-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe7cb"/>
    </linearGradient>
    <radialGradient id="basic-cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9d7d" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff9d7d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="basic-frame">
      <rect x="3" y="3" width="154" height="154" rx="34"/>
    </clipPath>
  </defs>
  <style>
    .state { display: none; }
    [data-state="idle"] .s-idle,
    [data-state="working"] .s-working,
    [data-state="meeting"] .s-meeting,
    [data-state="visiting"] .s-visiting,
    [data-state="sleeping"] .s-sleeping { display: inline; }
    .eye-open { display: inline; }
    .eye-closed { display: none; }
    [data-state="sleeping"] .eye-open { display: none; }
    [data-state="sleeping"] .eye-closed { display: inline; }
    .label { font: 600 12px/1 "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; fill: {{accent}}; letter-spacing: 0.08em; }
  </style>
  <g clip-path="url(#basic-frame)">
    <rect x="0" y="0" width="160" height="160" fill="url(#basic-bg)"/>
    <ellipse cx="80" cy="139" rx="47" ry="9" fill="#c8a87f" opacity="0.26"/>
    <path d="M54 46 L47 22 L72 35 Z" fill="url(#basic-body)" stroke="#8b6a4a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M106 46 L113 22 L88 35 Z" fill="url(#basic-body)" stroke="#8b6a4a" stroke-width="2.5" stroke-linejoin="round"/>
    <ellipse cx="80" cy="107" rx="42" ry="33" fill="url(#basic-body)" stroke="#8b6a4a" stroke-width="2.5"/>
    <circle cx="80" cy="70" r="33" fill="url(#basic-body)" stroke="#8b6a4a" stroke-width="2.5"/>
    <g class="eye-open">
      <circle cx="69" cy="68" r="4.6" fill="#4c3524"/>
      <circle cx="91" cy="68" r="4.6" fill="#4c3524"/>
      <circle cx="70.7" cy="66.1" r="1.5" fill="#ffffff"/>
      <circle cx="92.7" cy="66.1" r="1.5" fill="#ffffff"/>
    </g>
    <g class="eye-closed">
      <path d="M64 68 q5 5 10 0" fill="none" stroke="#4c3524" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M86 68 q5 5 10 0" fill="none" stroke="#4c3524" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <circle cx="58" cy="79" r="7.5" fill="url(#basic-cheek)"/>
    <circle cx="102" cy="79" r="7.5" fill="url(#basic-cheek)"/>
    <path d="M76 81 q4 4 8 0" fill="none" stroke="#8b6a4a" stroke-width="2" stroke-linecap="round"/>
    <rect x="71" y="103" width="18" height="13" rx="4" fill="{{accent}}" opacity="0.92"/>
    <rect x="75.5" y="107.5" width="9" height="2.2" rx="1.1" fill="#ffffff" opacity="0.92"/>
    <rect x="75.5" y="111" width="5.5" height="2.2" rx="1.1" fill="#ffffff" opacity="0.7"/>
    <g class="state s-idle">
      <circle cx="123" cy="44" r="2.6" fill="#e0a86a" opacity="0.9"/>
      <circle cx="131" cy="56" r="1.8" fill="#e0a86a" opacity="0.65"/>
      <circle cx="115" cy="34" r="1.5" fill="#e0a86a" opacity="0.5"/>
      <path d="M38 52 q6 -8 12 0" fill="none" stroke="#d5b591" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    </g>
    <g class="state s-working">
      <rect x="50" y="116" width="60" height="24" rx="4" fill="#6b5140"/>
      <rect x="54" y="120" width="52" height="14" rx="2" fill="#fff3e0"/>
      <rect x="58" y="124" width="26" height="2.4" rx="1.2" fill="{{accent}}"/>
      <rect x="58" y="129" width="16" height="2.4" rx="1.2" fill="#c9a882"/>
      <rect x="124" y="96" width="26" height="6" rx="3" fill="#e6d3ba"/>
      <rect x="124" y="96" width="17" height="6" rx="3" fill="{{accent}}"/>
    </g>
    <g class="state s-meeting">
      <rect x="20" y="24" width="42" height="24" rx="8" fill="#ffffff" stroke="#dcc3a2" stroke-width="2"/>
      <path d="M34 48 l0 8 l8 -8 z" fill="#ffffff" stroke="#dcc3a2" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="33" cy="36" r="2.4" fill="#b98d5e"/>
      <circle cx="41" cy="36" r="2.4" fill="#b98d5e"/>
      <circle cx="49" cy="36" r="2.4" fill="#b98d5e"/>
      <rect x="100" y="28" width="40" height="22" rx="8" fill="{{accent}}" opacity="0.9"/>
      <path d="M126 50 l0 8 l-8 -8 z" fill="{{accent}}" opacity="0.9"/>
      <path d="M108 36 h24 M108 42 h14" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>
    </g>
    <g class="state s-visiting">
      <rect x="104" y="30" width="34" height="24" rx="4" fill="#ffffff" stroke="#d3b591" stroke-width="2"/>
      <path d="M104 32 l17 12 l17 -12" fill="none" stroke="#d3b591" stroke-width="2" stroke-linejoin="round"/>
      <ellipse cx="34" cy="126" rx="7" ry="9" fill="#e8c9a4"/>
      <ellipse cx="46" cy="118" rx="7" ry="9" fill="#e8c9a4"/>
      <path d="M118 70 q10 6 0 12" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" opacity="0.75"/>
    </g>
    <g class="state s-sleeping">
      <path d="M112 32 a16 16 0 1 0 0 24 a13 13 0 0 1 0 -24 z" fill="#e6d3ba"/>
      <text x="118" y="58" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#b98d5e" opacity="0.85">z</text>
      <text x="130" y="48" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#b98d5e" opacity="0.6">z</text>
    </g>
    <text class="label" x="80" y="152" text-anchor="middle">{{stateLabel}}</text>
  </g>
</svg>
